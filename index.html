<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دستور المدينة | المجلس الأعلى</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1527;color:#e9edf5;font:16px Tahoma,Arial,sans-serif}main{max-width:1040px;margin:auto;padding:24px}header{background:linear-gradient(120deg,#152b48,#101b30);border:1px solid #38506c;border-radius:18px;padding:25px}h1{color:#e8c57c;margin:8px 0}h2{font-size:21px;color:#e8c57c}p{line-height:1.9}.muted{color:#aebbd0;font-size:14px}.tabs{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}button,.btn{border:0;border-radius:10px;padding:12px 18px;background:#d8b66d;color:#101929;font-weight:bold;cursor:pointer;font:inherit}button.secondary{background:#233954;color:#f1f4f8}button.danger{background:#713a46;color:white}button:focus,input:focus,textarea:focus{outline:2px solid #d8b66d}section{background:#12233a;border:1px solid #314864;border-radius:15px;padding:22px;margin-bottom:18px}input,textarea{width:100%;padding:13px;background:#0c1a2d;border:1px solid #435b77;border-radius:10px;color:white;font:inherit;margin:7px 0 14px}textarea{min-height:110px;resize:vertical}label{display:block;font-weight:bold}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.message{padding:14px;margin:12px 0;border-radius:10px;background:#203650;white-space:pre-wrap;line-height:1.9}.answer{background:#273a42;border-right:4px solid #d8b66d}.hidden{display:none}.item{border-bottom:1px solid #354861;padding:14px 0}.item:last-child{border:0}.pill{font-size:12px;background:#293f5d;padding:5px 9px;border-radius:9px}footer{text-align:center;color:#aebbd0;padding:16px}small{line-height:1.8}a{color:#e8c57c}@media(max-width:600px){main{padding:12px}.row{display:block}}</style></head><body><main><header><div class="muted">المجلس الأعلى | دستور المدينة</div><h1 id="siteTitle"></h1><p>تصفح مواد الدستور وابحث فيها. لا تتوفر صلاحية تعديل في هذه النسخة.</p></header><nav class="tabs"><button onclick="show('laws')">مواد الدستور</button><button class="secondary" onclick="show('chat')">البحث بالسؤال</button></nav><section id="laws"><h2>الدستور والأنظمة</h2><input id="filter" oninput="renderLaws()" placeholder="ابحث برقم المادة أو كلمة من النص"><div id="lawList"></div></section><section id="chat" class="hidden"><h2>اسأل عن مواد الدستور</h2><textarea id="question" placeholder="مثال: ما صلاحيات رئيس المجلس الأعلى؟"></textarea><button onclick="ask()">بحث</button><div id="reply"></div><p class="muted">هذه خدمة بحث نصي في المواد وليست نموذج ذكاء اصطناعي متصلًا.</p></section><footer>المجلس الأعلى | مرجع مواد الدستور</footer></main><script>const data={"city":"المدينة الجديدة","laws":[{"id":1,"title":"سيادة الدستور","text":"يعد هذا الدستور المرجع الأعلى لتنظيم السلطات الحكومية والحقوق والواجبات والإجراءات القانونية داخل المدينة، وتلتزم جميع الجهات والأفراد بأحكامه.","approved":false},{"id":2,"title":"السلطة الحكومية العليا","text":"رئيس المجلس الأعلى هو أعلى سلطة حكومية في المدينة، ويتولى الإشراف العام على الجهات الحكومية وضمان التزامها بالدستور والأنظمة.","approved":false},{"id":3,"title":"اختصاصات المجلس الأعلى","text":"يختص المجلس الأعلى باعتماد السياسات الحكومية العامة، وتنظيم العلاقة بين القطاعات، ومراجعة أداء القيادات، واتخاذ القرارات التنظيمية التي تدخل ضمن صلاحياته.","approved":false},{"id":4,"title":"تشكيل المجلس الأعلى","text":"يتكون المجلس الأعلى من رئيس المجلس والأعضاء الذين يصدر بتحديدهم قرار رسمي، وتحدد صلاحيات كل عضو بقرار من رئيس المجلس.","approved":false},{"id":5,"title":"صلاحيات رئيس المجلس","text":"يحق لرئيس المجلس الأعلى تعيين القيادات الحكومية العليا وإعفاؤها، واعتماد نوابها، والدعوة إلى الاجتماعات الرسمية، وطلب التقارير، وإصدار القرارات التنظيمية وفق الدستور.","approved":false},{"id":6,"title":"استقلال القضاء","text":"تتمتع السلطة القضائية بالاستقلال عند نظر القضايا وإصدار الأحكام، ولا يجوز لأي جهة حكومية التدخل في حكم قضائي قائم خارج طرق الاعتراض النظامية.","approved":false},{"id":7,"title":"إنشاء القطاعات الحكومية","text":"يجوز إنشاء قطاعات حكومية جديدة أو دمجها أو إعادة تنظيمها بقرار من المجلس الأعلى وفق احتياجات المدينة.","approved":false},{"id":8,"title":"تعديل الدستور","text":"لا يجوز تعديل أي مادة أو إلغاؤها إلا بقرار رسمي من رئيس المجلس الأعلى، بعد مراجعة أثر التعديل على الجهات المختصة وإعلانه للعموم.","approved":false},{"id":9,"title":"وزارة العدل","text":"تتولى وزارة العدل تنظيم الأعمال القضائية والإدارية التابعة لها، والإشراف على المحاكم والكوادر القانونية وفق اختصاصاتها.","approved":false},{"id":10,"title":"وزير العدل","text":"يشرف وزير العدل على أعمال الوزارة، ويقترح تطوير الأنظمة القضائية، ويرفع تقارير الوزارة إلى المجلس الأعلى.","approved":false},{"id":11,"title":"رئيس المحكمة","text":"يتولى رئيس المحكمة إدارة أعمال المحكمة، وتنظيم الجلسات، والإشراف على القضاة إداريًا دون التدخل في أحكامهم.","approved":false},{"id":12,"title":"رئيس القضاة","text":"يشرف رئيس القضاة على توزيع القضايا ومتابعة انتظام العمل القضائي، بالتنسيق مع رئيس المحكمة.","approved":false},{"id":13,"title":"اختصاص القاضي","text":"يختص القاضي بالفصل في القضايا المعروضة عليه، وتقدير الأدلة، وإصدار الأحكام والعقوبات في حدود الأنظمة.","approved":false},{"id":14,"title":"القاضي المساعد","text":"يتولى القاضي المساعد الأعمال القضائية المكلف بها، ولا يصدر حكمًا نهائيًا إلا إذا كانت لديه صلاحية قضائية معتمدة.","approved":false},{"id":15,"title":"المدعي العام","text":"يتولى المدعي العام مباشرة الادعاء في القضايا الداخلة ضمن اختصاصه، وتقديم الأدلة والطلبات أمام المحكمة.","approved":false},{"id":16,"title":"المحاماة","text":"يحق لكل متهم أو طرف في دعوى الاستعانة بمحامٍ مرخص، وتلتزم الجهات المختصة بتمكين المحامي من أداء مهامه وفق الإجراءات المعتمدة.","approved":false},{"id":17,"title":"الحياد القضائي","text":"يمنع على القاضي نظر قضية تكون له فيها مصلحة شخصية مباشرة أو علاقة تؤثر في حياده، ويحال النظر فيها إلى قاضٍ آخر.","approved":false},{"id":18,"title":"تنفيذ الأحكام","text":"تلتزم الجهات الحكومية المختصة بتنفيذ الأحكام القضائية النهائية، ولا يجوز تعطيل تنفيذها دون مسوغ نظامي.","approved":false},{"id":19,"title":"اختصاص الشرطة","text":"تتولى الشرطة المحافظة على الأمن والنظام العام، وحماية المواطنين والممتلكات، وضبط المخالفات والجرائم وفق القانون.","approved":false},{"id":20,"title":"قائد الشرطة","text":"يتولى قائد الشرطة إدارة القطاع الأمني وتنظيم وحداته ومتابعة أداء منسوبيه، ويكون مسؤولًا عن قراراته الإدارية أمام المجلس الأعلى.","approved":false},{"id":21,"title":"نائب قائد الشرطة","text":"يمارس نائب قائد الشرطة الصلاحيات المفوضة إليه، ويتولى مهام القيادة عند غياب القائد وفق التكليف الرسمي.","approved":false},{"id":22,"title":"صلاحيات رجال الأمن","text":"يجوز لرجل الأمن اتخاذ الإجراءات اللازمة لمنع الجرائم وضبط مرتكبيها، على أن تكون الإجراءات متناسبة مع الواقعة ومبنية على سبب نظامي.","approved":false},{"id":23,"title":"التوقيف","text":"لا يجوز توقيف أي شخص دون سبب مشروع، ويجب بيان سبب التوقيف وإحالته إلى الجهة المختصة وفق الإجراءات المعتمدة.","approved":false},{"id":24,"title":"التفتيش","text":"لا يجوز تفتيش الأشخاص أو الممتلكات إلا في الحالات التي يسمح بها القانون أو بموجب إذن صادر من الجهة المختصة.","approved":false},{"id":25,"title":"استخدام القوة","text":"يجب أن يكون استخدام القوة من رجال الأمن بالقدر اللازم للتعامل مع الخطر، ويحظر استخدام القوة المفرطة أو الانتقامية.","approved":false},{"id":26,"title":"المسؤولية الأمنية","text":"يحاسب رجل الأمن الذي يسيء استخدام صلاحياته أو يزوّر الأدلة أو يعتدي على المواطنين دون مسوغ نظامي.","approved":false},{"id":27,"title":"اختصاص الصحة","text":"يتولى القطاع الصحي تقديم الخدمات الطبية والإسعافية، وتنظيم العمل داخل المستشفى والمرافق الصحية.","approved":false},{"id":28,"title":"القيادة الصحية","text":"يتولى المسؤول الصحي المختص الإشراف على القطاع، وتنظيم الكوادر الطبية والمناوبات والتجهيزات، وفق الصلاحيات المعتمدة.","approved":false},{"id":29,"title":"تقديم الإسعاف","text":"يلتزم المسعفون والأطباء بتقديم المساعدة الطبية للحالات الطارئة دون تمييز أو تعمد تأخير.","approved":false},{"id":30,"title":"حماية الكوادر الطبية","text":"يمنع الاعتداء على الكوادر الطبية أو عرقلة عملها أثناء أداء واجباتها، ويعاقب المخالف وفق أحكام الاعتداء وعرقلة الجهات الحكومية.","approved":false},{"id":31,"title":"السجلات الطبية","text":"تحفظ السجلات الطبية بسرية، ولا يجوز إفشاء بياناتها إلا بموافقة صاحب العلاقة أو بناءً على طلب نظامي من الجهة المختصة.","approved":false},{"id":32,"title":"المساواة أمام القانون","text":"جميع المواطنين متساوون أمام الأنظمة، ولا يجوز التمييز بينهم عند تطبيق الإجراءات والعقوبات بسبب المنصب أو النفوذ أو العلاقة الشخصية.","approved":false},{"id":33,"title":"حماية الحقوق","text":"تكفل الجهات الحكومية حماية الحقوق المشروعة للمواطنين، ويجوز لكل متضرر التقدم بشكوى إلى الجهة المختصة.","approved":false},{"id":34,"title":"قرينة البراءة","text":"الأصل في المتهم البراءة حتى تثبت مسؤوليته وفق الأدلة والإجراءات النظامية.","approved":false},{"id":35,"title":"حق الدفاع","text":"يحق للمتهم معرفة التهمة الموجهة إليه، والاطلاع على الأدلة المسموح بإتاحتها، وتقديم دفاعه أمام الجهة القضائية المختصة.","approved":false},{"id":36,"title":"حرمة الممتلكات","text":"لا يجوز مصادرة ممتلكات أي مواطن أو إتلافها دون مسوغ قانوني أو قرار صادر من الجهة المختصة.","approved":false},{"id":37,"title":"واجب الالتزام","text":"يلتزم المواطن باحترام الأنظمة والتعليمات المشروعة الصادرة من الجهات الحكومية المختصة.","approved":false},{"id":38,"title":"منع استغلال النفوذ","text":"يحظر استغلال المناصب الحكومية أو العلاقات الشخصية للحصول على امتيازات غير مستحقة أو التأثير في الإجراءات القانونية.","approved":false},{"id":39,"title":"حق التظلم","text":"يحق لكل مواطن الاعتراض على الإجراءات الحكومية التي يعتقد أنها أضرت بحقوقه، وفق الطرق والمواعيد المحددة.","approved":false},{"id":40,"title":"القتل العمد","text":"يعاقب كل من يتعمد قتل شخص بالسجن من 150 إلى 300 دقيقة، وتقدر المحكمة العقوبة وفق ظروف الجريمة، ويعد سبق الإصرار أو التخطيط من الظروف المشددة.","approved":false},{"id":41,"title":"الشروع في القتل","text":"يعاقب كل من يبدأ تنفيذ فعل بقصد القتل دون أن تكتمل الجريمة بالسجن من 60 إلى 150 دقيقة، وغرامة من 5,000 إلى 15,000 دولار.","approved":false},{"id":42,"title":"الاعتداء الجسدي","text":"يعاقب كل من يعتدي جسديًا على شخص آخر دون مسوغ مشروع بالسجن من 15 إلى 45 دقيقة، وغرامة من 1,000 إلى 5,000 دولار.","approved":false},{"id":43,"title":"التهديد","text":"يعاقب كل من يهدد شخصًا بإلحاق أذى جسيم به أو بممتلكاته بالسجن من 15 إلى 30 دقيقة، وغرامة من 1,000 إلى 3,000 دولار.","approved":false},{"id":44,"title":"سرقة الممتلكات","text":"يعاقب كل من يستولي عمدًا على ممتلكات الغير دون حق بالسجن من 30 إلى 75 دقيقة، وغرامة من 2,500 إلى 7,500 دولار، مع إعادة الممتلكات متى أمكن.","approved":false},{"id":45,"title":"السطو المسلح","text":"يعاقب كل من يرتكب سرقة باستخدام سلاح أو تهديد مباشر بالسجن من 60 إلى 120 دقيقة، وغرامة من 5,000 إلى 15,000 دولار.","approved":false},{"id":46,"title":"إطلاق النار دون مسوغ","text":"يعاقب كل من يطلق النار دون مبرر مشروع، بما في ذلك المشاركة غير المشروعة في تبادل إطلاق النار، بالسجن من 30 إلى 75 دقيقة، وغرامة من 5,000 إلى 10,000 دولار.","approved":false},{"id":47,"title":"حيازة السلاح المخالف","text":"يعاقب كل من يحوز سلاحًا محظورًا أو يخالف شروط الترخيص بالسجن من 15 إلى 45 دقيقة، وغرامة من 2,000 إلى 6,000 دولار، مع مصادرة السلاح المخالف.","approved":false},{"id":48,"title":"الخطف والاحتجاز غير المشروع","text":"يعاقب كل من يخطف شخصًا أو يحتجزه دون حق بالسجن من 60 إلى 150 دقيقة، وغرامة من 5,000 إلى 15,000 دولار.","approved":false},{"id":49,"title":"إتلاف الممتلكات","text":"يعاقب كل من يتعمد تخريب ممتلكات عامة أو خاصة بالسجن من 15 إلى 45 دقيقة، وغرامة من 1,000 إلى 5,000 دولار، مع جواز إلزامه بالتعويض.","approved":false},{"id":50,"title":"الرشوة","text":"يعاقب كل من يقدم أو يطلب أو يقبل رشوة للتأثير في واجب حكومي بالسجن من 45 إلى 90 دقيقة، وغرامة من 5,000 إلى 15,000 دولار، مع جواز العزل من المنصب.","approved":false},{"id":51,"title":"انتحال الصفة الرسمية","text":"يعاقب كل من ينتحل صفة موظف حكومي أو رجل أمن أو قاضٍ بالسجن من 30 إلى 60 دقيقة، وغرامة من 3,000 إلى 8,000 دولار.","approved":false},{"id":52,"title":"عرقلة العدالة","text":"يعاقب كل من يتعمد إخفاء الأدلة أو تزويرها أو التأثير غير المشروع على الشهود أو تعطيل الإجراءات القضائية بالسجن من 30 إلى 90 دقيقة، وغرامة من 3,000 إلى 10,000 دولار.","approved":false},{"id":53,"title":"الظروف المشددة","text":"يجوز للقاضي تجاوز الحد الأعلى للعقوبة عند وجود ظروف مشددة ثابتة، مثل تكرار الجريمة أو التخطيط المسبق أو استغلال المنصب، على أن يبين أسباب التشديد في الحكم.","approved":false},{"id":54,"title":"الحد الأدنى للسجن","text":"لا يجوز أن تقل عقوبة السجن المحكوم بها في أي جريمة تصل إلى المحكمة وتستوجب السجن عن 15 دقيقة، ما لم يصدر نص خاص يقرر خلاف ذلك.","approved":false},{"id":55,"title":"تقديم الشكاوى","text":"يحق لكل متضرر تقديم شكوى رسمية إلى الجهة المختصة، على أن تتضمن الشكوى وصف الواقعة والأطراف والأدلة المتوفرة.","approved":false},{"id":56,"title":"التحقيق","text":"تتولى الجهة المختصة التحقيق في الوقائع وجمع الأدلة وسماع أقوال الأطراف، مع الالتزام بالحياد وعدم إساءة استخدام الصلاحيات.","approved":false},{"id":57,"title":"الإحالة إلى المحكمة","text":"تحال القضية إلى المحكمة عند توافر أسباب قانونية كافية للنظر فيها، ويجب إرفاق الأدلة والمحاضر المتعلقة بالواقعة.","approved":false},{"id":58,"title":"جلسات المحاكمة","text":"تمنح المحكمة أطراف القضية فرصة عرض أقوالهم وأدلتهم ودفوعهم، ويجوز للقاضي تنظيم الجلسة ومنع تعطيلها.","approved":false},{"id":59,"title":"الاعتراض على الأحكام","text":"يجوز الاعتراض على الأحكام القضائية وفق الإجراءات المعتمدة، وتتولى الجهة القضائية المختصة النظر في الاعتراض دون تدخل إداري في نتيجة الحكم.","approved":false},{"id":60,"title":"تسبيب الأحكام","text":"يجب أن يتضمن الحكم القضائي بيان الوقائع الثابتة والأدلة المعتمدة والأساس القانوني والعقوبة أو القرار الصادر.","approved":false},{"id":61,"title":"طلب إيقاف الخدمات","text":"يقتصر حق تقديم طلب إيقاف خدمات المواطن على قائد الشرطة أو نائبه، ويجب أن يكون الطلب مسببًا ومرفقًا بما يدعمه من أدلة، ويرفع إلى وزارة العدل.","approved":false},{"id":62,"title":"قرار إيقاف الخدمات","text":"لا ينفذ إيقاف الخدمات إلا بقرار من الجهة القضائية المختصة، يحدد أسباب الإيقاف ومدته والخدمات المشمولة به، ويجوز طلب مراجعته عند زوال أسبابه.","approved":false},{"id":63,"title":"شهادة حسن السيرة والسلوك","text":"يجوز للمواطن التقدم بطلب شهادة حسن السيرة والسلوك وفق الإجراءات المعتمدة، ويشترط لمن يتطلب وضعه تسوية سجل سابق دفع رسوم قدرها 5,000 دولار وإتمام 6 ساعات تطوع في القطاع الصحي. ويجوز للمواطن الجديد الذي لا توجد عليه سوابق الحصول على الشهادة مباشرة.","approved":false},{"id":64,"title":"مساءلة القيادات الحكومية","text":"تخضع القيادات الحكومية للمساءلة عند التقصير أو إساءة استخدام الصلاحيات، ويجب تمكين المسؤول من بيان أقواله قبل إصدار قرار إعفائه أو معاقبته، ما لم تستلزم الضرورة إيقافه مؤقتًا عن العمل.","approved":false},{"id":65,"title":"القرارات والتعاميم","text":"تلتزم الجهات الحكومية بالتعاميم والقرارات الصادرة من الجهات المختصة، ولا يجوز لأي تعميم مخالفة أحكام الدستور، وتعلن التعديلات التنظيمية للجهات المعنية.","approved":false},{"id":66,"title":"نفاذ الدستور","text":"يعمل بهذا الدستور من تاريخ إقراره ونشره رسميًا من المجلس الأعلى، ويلغى كل حكم تنظيمي سابق يتعارض مع أحكامه.","approved":false}]};function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(id){['laws','chat'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}function renderLaws(){let q=document.getElementById('filter').value.trim();document.getElementById('lawList').innerHTML=data.laws.filter(l=>!q||String(l.id).includes(q)||(l.title+' '+l.text).includes(q)).sort((a,b)=>a.id-b.id).map(l=>`<div class="item"><b>المادة (${l.id}): ${esc(l.title)}</b><p>${esc(l.text)}</p></div>`).join('')||'<p>لا توجد نتائج</p>'}function normalize(s){return s.toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْ]/g,'').replace(/[^\u0621-\u064Aa-z0-9\s]/g,' ')}function ask(){let q=document.getElementById('question').value.trim();if(!q)return;let words=[...new Set(normalize(q).split(/\s+/).filter(w=>w.length>2))];let matches=data.laws.map(l=>({l,score:words.reduce((n,w)=>n+(normalize(l.title+' '+l.text).includes(w)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);document.getElementById('reply').innerHTML=matches.length?matches.map(({l})=>`<div class="message answer"><b>المادة (${l.id}): ${esc(l.title)}</b><p>${esc(l.text)}</p></div>`).join(''):'<p>لم أجد مادة مطابقة، جرب كلمات أخرى.</p>'}document.getElementById('siteTitle').textContent='دستور '+data.city;renderLaws();</script></body></html>
