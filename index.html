function normalize(s){
return String(s).toLowerCase()
.replace(/[أإآ]/g,"ا").replace(/ى/g,"ي")
.replace(/ة/g,"ه").replace(/[\u064B-\u065F]/g,"")
.replace(/[،.؟:()]/g," ").replace(/\s+/g," ").trim();
}
function switchTab(tab){
currentTab=tab;
document.getElementById("constitutionBtn").classList.toggle("active",tab==="constitution");
document.getElementById("regulationBtn").classList.toggle("active",tab==="regulation");
document.getElementById("search").value="";
render();
}
function render(){
const root=document.getElementById("results");
root.replaceChildren();
const query=normalize(document.getElementById("search").value);
const source=currentTab==="constitution"?constitution:regulation;
let count=0,number=0;
for(const [section,items] of source){
const matches=[];
for(const [title,body] of items){
if(currentTab==="constitution")number++;
const id=number;
const haystack=normalize(title+" "+body+" "+(currentTab==="constitution"?"المادة "+id:""));
const numeric=query.match(/^(?:الماده\s*)?(\d+)$/);
const found=!query||haystack.includes(query)||
(currentTab==="constitution"&&numeric&&Number(numeric[1])===id);
if(found)matches.push({title,body,id});
}
if(!matches.length)continue;
const heading=document.createElement("h2");
heading.className="section-title";
heading.textContent=section;
root.appendChild(heading);
for(const item of matches){
const card=document.createElement("article");
card.className="article";
const h=document.createElement("h3");
h.textContent=currentTab==="constitution"?"المادة ("+item.id+"): "+item.title:item.title;
const p=document.createElement("p");
p.textContent=item.body;
card.append(h,p);
root.appendChild(card);
count++;
}
}
if(!count){
const empty=document.createElement("div");
empty.className="empty";
empty.textContent="لم يتم العثور على مادة مطابقة. جرب كلمة أخرى أو رقم المادة.";
root.appendChild(empty);
}
}
render();
</script>
